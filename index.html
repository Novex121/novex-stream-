<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVEX Stream</title>
  <link rel="stylesheet" href="style.css">
  <!-- Family-Safe Google AdSense Code Placeholder -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9384237360541435"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- Top App Navigation -->
  <header>
    <div class="logo">NOVEX</div>
    
    <!-- Controls Toolbar -->
    <div class="header-controls">
      <button class="icon-btn" onclick="toggleDataSaver()" id="dataSaverBtn">⚡ Data Normal</button>
      <button class="icon-btn" onclick="openParentalModal()">🔒 Parents</button>
      <span id="premiumBadge" class="premium-badge" onclick="togglePremium()">⭐ Premium</span>
    </div>
  </header>

  <!-- Live Search Bar -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Search cartoons, movies, shows..." onkeyup="filterVideos()">
  </div>

  <!-- Categories Quick Navigation Filter Bar -->
  <div class="category-filter-bar" id="categoryFilterBar">
    <button class="cat-pill active" onclick="filterByCategory('All')">All</button>
    <button class="cat-pill" onclick="filterByCategory('Cartoons')">Cartoons</button>
    <button class="cat-pill" onclick="filterByCategory('Movies')">Movies</button>
    <button class="cat-pill" onclick="filterByCategory('Kids Shows')">Kids Shows</button>
  </div>

  <!-- Top Banner Ad (Hidden if Premium is Active) -->
  <div class="ad-container" id="topAd">
    <p class="ad-label">Advertisement (Family Safe)</p>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-0000000000000000"
         data-ad-slot="1234567890"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- Featured Hero Banner -->
  <section class="hero" id="heroSection">
    <div class="hero-card">
      <span class="badge">Featured</span>
      <h1>PAW Patrol</h1>
      <p>Adventure never stops!</p>
      <div class="hero-btns">
        <button onclick="playFeatured()">▶ Watch Now</button>
        <button class="download-btn" onclick="triggerDownload('https://www.w3schools.com/html/mov_bbb.mp4', 'PAW_Patrol.mp4')">📥 Download (Offline)</button>
      </div>
    </div>
  </section>

  <!-- Dynamic Content Container -->
  <main id="categoryContainer"></main>

  <!-- Middle Banner Ad (Hidden if Premium is Active) -->
  <div class="ad-container" id="bottomAd">
    <p class="ad-label">Advertisement (Family Safe)</p>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-0000000000000000"
         data-ad-slot="0987654321"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- Parental Controls Modal -->
  <div id="parentalModal" class="modal">
    <div class="modal-content">
      <button class="close-modal-btn" onclick="closeParentalModal()">✕</button>
      <h2>🔒 Parental Controls</h2>
      <p>Manage content restrictions for children.</p>
      
      <div id="pinSection">
        <div class="form-group">
          <label>Enter 4-Digit Parent PIN:</label>
          <input type="password" id="parentPinInput" maxlength="4" placeholder="1234">
        </div>
        <button onclick="unlockParentSettings()">Unlock Settings</button>
      </div>

      <div id="parentSettingsSection" style="display: none;">
        <div class="form-group">
          <label for="ratingSelect">Content Restriction Level:</label>
          <select id="ratingSelect" onchange="updateContentFilter()">
            <option value="ALL">All Content (Kids & General)</option>
            <option value="KIDS">Kids Only (Under 7)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Change 4-Digit PIN:</label>
          <input type="password" id="newPinInput" maxlength="4" placeholder="Set New PIN">
          <button onclick="saveNewPin()" style="margin-top: 8px;">Save New PIN</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Smart Video Player Overlay with Quality Selector -->
  <div id="playerModal" class="player-modal">
    <button class="close-btn" onclick="closePlayer()">✕ Close</button>
    
    <div class="player-toolbar">
      <label for="qualitySelect">Quality Version:</label>
      <select id="qualitySelect" onchange="changeVideoQuality()">
        <option value="1080p">1080p (HD)</option>
        <option value="720p" selected>720p (SD)</option>
        <option value="480p">480p (Data Saver)</option>
      </select>
    </div>

    <video id="mp4Player" controls style="display: none;">
      <source id="videoSource" src="" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <iframe id="youtubePlayer" style="display: none; width: 90%; max-width: 800px; height: 450px; border: none; border-radius: 8px;" allowfullscreen></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
